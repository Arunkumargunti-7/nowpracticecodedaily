<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Futuristic GK Site</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <h1>Daily Practice Coding, Git hub and Linux </h1>

    <!-- Section 1: Q&A -->
    <div class="section">
      <h2>Question: What is the capital of France?</h2>
      <input type="text" id="answer" placeholder="Enter your answer" />
      <div class="btn-group">
        <button id="updateAnswer">Update</button>
        <button id="saveAnswer">Save</button>
      </div>
      <p id="status"></p>
    </div>

    <!-- Section 2: Image Guess -->
    <div class="section">
      <h2>Guess the Image</h2>
      <img id="imageDisplay" src="assets/images/sample.jpg" alt="Sample Image" />
      <input type="text" id="imageName" placeholder="Enter image name" />
      <div class="btn-group">
        <button id="updateImage">Update</button>
        <button id="saveImage">Save</button>
      </div>
      <p id="imageStatus"></p>

      <h3>Upload New Image</h3>
      <input type="file" id="imageUpload" accept="image/*" />
    </div>

    <!-- Section 3: Documents -->
    <div class="section">
      <h2>Download/View Document</h2>
      <a href="assets/docs/sample.pdf" download>Download Sample PDF</a>

      <h3>Upload a Document</h3>
      <input type="file" id="documentUpload" accept=".pdf, .docx, .txt" />
      <p id="documentStatus"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
